# N+1 쿼리 수 측정 전용 프로필 (NPlusOneQueryCountTest)
#
# 운영 DB(PostgreSQL) 대신 H2 인메모리 DB를 쓴다.
# 응답 시간이 아니라 "요청 1회당 SQL 개수"를 재는 테스트라 DB 종류와 무관하게 같은 값이 나온다.
# 컨텍스트마다 DB 이름을 다르게 두어, 설정이 다른 테스트 클래스끼리 데이터가 섞이지 않게 한다.
spring.datasource.url=jdbc:h2:mem:nplusone_${random.value};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE,KEY,YEAR,MONTH,DAY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# 실행된 SQL 개수를 세기 위해 Hibernate 통계를 켠다.
spring.jpa.properties.hibernate.generate_statistics=true
# 세션마다 찍히는 통계 로그는 너무 길어서 끈다.
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=WARN

# 앱 기동에 필요한 값들 (테스트용 더미)
jwt.secret=nplusone-test-secret-key-must-be-long-enough-for-hs256-signing
# 측정 중에 스케줄러가 쿼리를 날리지 않도록 끈다.
jwt.refresh-token-cleanup-cron=-
openai.api.key=test-key
