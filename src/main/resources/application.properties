spring.application.name=app

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=10

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

jwt.secret=${JWT_SECRET}
# Access Token 유효 시간 (기본 1시간). 만료 후에는 Refresh Token으로 재발급받는다.
jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:3600000}
# Refresh Token 유효 시간 (기본 14일)
jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:1209600000}
# 만료된 Refresh Token 정리 주기 (기본 매일 새벽 4시, "-"로 두면 비활성화)
jwt.refresh-token-cleanup-cron=${JWT_REFRESH_TOKEN_CLEANUP_CRON:0 0 4 * * *}

openai.api.key=${OPENAI_API_KEY}

# 뜻 조회용 설정. 이 두 값은 실제 호출로 맞춘 것이라 함부로 낮추거나 올리면 안 된다.
#
# gpt-5 계열은 추론 모델이라 추론 토큰이 max_completion_tokens 를 같이 먹는다.
#  - 기본(medium)으로 두면 掛ける/カケ 처럼 사전형과 읽기가 어긋나 보이는 입력에서 추론만 하다
#    예산이 바닥나 본문이 빈 채로 돌아온다 (5000 토큰에서도 발생).
#  - minimal 로 낮추면 예산 문제는 사라지지만 동형이의어를 못 가른다
#    (生物/ナマモノ 가 "생물"로, 一日/ツイタチ 가 "하루"로 나온다). 읽기를 무시한 것과 같아진다.
# low + 3000 이 둘 다 만족하는 조합이다 (18회 호출 기준 빈 응답 0, 읽기 판별 전부 정상).
#
# 추론 모델이 아닌 모델로 바꿀 때는 reasoning-effort 를 빈 값으로 두면 파라미터를 보내지 않는다.
openai.meaning.reasoning-effort=${OPENAI_MEANING_REASONING_EFFORT:low}
openai.meaning.max-completion-tokens=${OPENAI_MEANING_MAX_COMPLETION_TOKENS:3000}

# /create_word_meaning : 사용자별 호출 제한 (LLM 비용이 드는 경로라 "+" 연타를 막는다)
wordmeaning.rate-limit.capacity=${WORD_MEANING_RATE_LIMIT_CAPACITY:20}
wordmeaning.rate-limit.window-seconds=${WORD_MEANING_RATE_LIMIT_WINDOW_SECONDS:60}
# 뜻은 모달의 3줄짜리 textarea에 그대로 들어가므로 길이를 잘라둔다 (한국어 기준 20자 권장, 다른 언어까지 감안한 상한)
wordmeaning.max-length=${WORD_MEANING_MAX_LENGTH:60}

servers.url